<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#cfe7f2" />
<title>The Office</title>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<canvas id="stage"></canvas>

<header id="topbar">
  <button id="brand" type="button" title="frame the whole office">
    <span class="brand-mark"></span>
    <span class="brand-text">The Office</span>
  </button>
  <div id="stats"></div>
  <button id="needs" class="pill pill-alert" type="button" hidden></button>
  <button id="refresh" class="pill" type="button" title="pull the latest snapshot">refresh</button>
</header>

<aside id="panel" hidden></aside>
<div id="toast" hidden></div>

<div id="gate" hidden>
  <div class="gate-card">
    <h1>Locked</h1>
    <p>This office needs its key. Open the link with <code>#k=&lt;view token&gt;</code> once and it will remember.</p>
    <input id="gate-key" type="password" placeholder="view token" autocomplete="off" spellcheck="false" />
    <button id="gate-go" type="button">Unlock</button>
  </div>
</div>

<div id="boot">waking the office…</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
