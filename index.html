<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#cfe7f2" />
<title>The Office</title>
<link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
<canvas id="stage"></canvas>

<header id="topbar">
  <button id="brand" type="button" title="frame the whole office">
    <span class="brand-mark"></span>
    <span class="brand-text">The Office</span>
  </button>
  <div id="stats"></div>
  <button id="needs" class="pill pill-alert" type="button" hidden></button>
  <div id="modes" class="segmented"></div>
  <button id="unhide" class="pill pill-quiet" type="button" hidden></button>
  <button id="tomerge" class="pill pill-go" type="button" hidden></button>
  <button id="orders" class="pill" type="button" hidden></button>
  <button id="talk" class="pill" type="button" title="talk to the local runtime">talk</button>
  <button id="refresh" class="pill" type="button" title="pull the latest snapshot">refresh</button>
</header>

<aside id="panel" hidden></aside>
<div id="toast" hidden></div>

<div id="boot">waking the office…</div>
<div id="demo-flag">demo floor — nothing here is real</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
