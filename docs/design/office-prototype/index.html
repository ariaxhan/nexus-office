<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Office · quieter prototype</title>
  <link rel="stylesheet" href="./prototype.css">
  <link rel="stylesheet" href="./watch.css">
  <link rel="stylesheet" href="./experience.css">
  <link rel="stylesheet" href="./watch-ask.css">
  <link rel="stylesheet" href="./ask-feed.css">
  <link rel="stylesheet" href="./media.css">
  <script defer src="./prototype.js"></script>
  <script defer src="./experience.js"></script>
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Office navigation">
      <a class="brand" href="#home">nexus <i>office</i><small>prototype</small></a>
      <nav id="navigation" class="navigation" aria-label="Main">
        <button data-view="home" class="selected"><span class="nav-icon">⌂</span> Watch <span class="count">3</span></button>
        <button data-view="work"><span class="nav-icon">□</span> Feed</button>
        <button data-view="ask"><span class="nav-icon">✦</span> Ask</button>
        <button data-view="find"><span class="nav-icon">⌕</span> Find</button>
      </nav>
      <div class="rail-bottom"><button id="places" class="text-button">All places <span>⌄</span></button><button id="status" class="status"><span class="status-dot"></span> Mac connected</button></div>
    </aside>
    <div class="shell">
      <header class="topbar"><div class="mobile-brand">nexus <i>office</i></div><div class="breadcrumb" id="breadcrumb">Home</div><button id="new-task" class="new-button">+ New task</button><button id="profile" class="avatar" aria-label="Open profile">A</button></header>
      <main id="main" tabindex="-1"></main>
    </div>
    <nav class="bottom-nav" aria-label="Mobile navigation"><button data-view="home" class="selected"><span>⌂</span>Watch</button><button data-view="work"><span>□</span>Feed</button><button data-view="ask"><span>✦</span>Ask</button><button data-view="find"><span>⌕</span>Find</button></nav>
  </div>
  <dialog id="detail"><header><button id="back" class="icon-button" aria-label="Close detail">←</button><span id="detail-heading"></span><button id="detail-menu" class="icon-button" aria-label="More actions">⋯</button></header><div id="detail-content"></div></dialog>
  <dialog id="composer"><header><button id="close-composer" class="icon-button" aria-label="Close new task">←</button><span>New task</span></header><form id="task-form"><label>Project<select id="task-project"><option>Nexus Office</option><option>Thinking Brain School</option><option>CollabVault</option></select></label><label>Agent<select id="task-agent"><option>Claude · Personal</option><option>Codex · Personal</option><option>Claude · TBS</option><option>Codex · TBS</option></select></label><label>What should the agent do?<textarea id="task-prompt" placeholder="Describe the outcome you want…" required></textarea></label><button class="primary" type="submit">Start task</button></form></dialog>
  <div id="toast" role="status" hidden></div>
</body>
</html>
