<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>The office</title>
<!-- Two files, both from this door. No framework, no CDN, no build step: the
     page that answers a raised hand must not depend on anything that can be
     down, and a phone on a tailnet has no route to a CDN anyway. -->
<link rel="stylesheet" href="/phone.css">
</head>
<body>

<header class="top">
  <p class="mark">the office</p>
  <p class="stamp" id="stamp">opening</p>
  <button class="refresh" id="refresh" type="button">refresh</button>
</header>

<main id="room">
  <!-- Every one of these is filled by phone.js. The order is the point: the
       raised hand is the first thing on the page, always, and nothing below it
       can push it off. -->
  <section class="band gateband" id="gate" hidden></section>
  <!-- What happened while nobody was looking, then everything that is waiting.
       The catch-up line sits under the raised hand and above the queue: it is
       context for the queue, never a thing to answer. -->
  <section class="band" id="catchup" hidden></section>
  <!-- What is running on the machine this second, read from the process table
       rather than from the harness: every Claude Code and Codex session, whether
       or not it ever joined. It sits above the queue because it is the answer to
       "what is happening right now", and it is read only. -->
  <section class="band" id="live" hidden></section>
  <section class="band" id="needs" hidden></section>
  <section class="band" id="bots"></section>
  <section class="band" id="desks"></section>
  <section class="band" id="automation"></section>
  <section class="band" id="wall"></section>
</main>

<div class="thread" id="thread" hidden></div>
<div class="thread deskpanel" id="desk" hidden></div>
<!-- The transcript reader. Same panel as a thread and deliberately without its
     composer: this one is a window on a session nobody here can answer. -->
<div class="thread reader" id="reader" hidden></div>
<p class="toast" id="toast" hidden></p>

<script src="/phone.js"></script>
</body>
</html>
