<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nexus Office</title>
  <link rel="apple-touch-icon" href="/office-icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/office.css">
  <link rel="stylesheet" href="/office-v2.css">
  <script type="module" src="/office.js"></script>
</head>
<body>
<noscript><p>Enable JavaScript for the interactive office. <a href="/lessons">Lesson previews</a></p></noscript>
<div class="shell">
  <header class="topbar">
    <a class="wordmark" href="#watch">nexus <i>office</i><span class="connection" id="connection">Connecting</span></a>
    <button id="settings" disabled aria-label="Open settings">⚙</button>
    <button class="primary" id="new-task" disabled>+ New task</button>
  </header>
  <div class="searchbar">
    <label for="global-search">⌕</label>
    <input id="global-search" aria-label="Search everything in Office" type="search" placeholder="Search Office" autocomplete="off">
    <button id="search-go" aria-label="Search everything">Search</button>
  </div>
  <main id="content" tabindex="-1"></main>
  <aside id="player" hidden aria-label="Podcast player"></aside>
  <nav class="tabs" aria-label="Office">
    <a href="#watch" aria-label="Watch"><span class="tab-icon">⌂</span><span>Watch</span></a>
    <a href="#feed" aria-label="Feed"><span class="tab-icon">□</span><span>Feed</span></a>
    <a href="#ask" aria-label="Ask"><span class="tab-icon">✦</span><span>Ask</span></a>
    <a href="#find" aria-label="Find"><span class="tab-icon">⌕</span><span>Find</span></a>
  </nav>
</div>
<dialog id="detail">
  <header>
    <button id="close-detail" aria-label="Close detail"><span>←</span> Back</button>
    <span id="detail-title"></span>
    <button id="detail-search" aria-label="Search everything">⌕</button>
    <button id="detail-attention" aria-label="Items needing you">!</button>
  </header>
  <div id="detail-body"></div>
</dialog>
<div id="notice" role="status" hidden></div>
<audio id="audio" preload="metadata"></audio>
</body>
</html>
