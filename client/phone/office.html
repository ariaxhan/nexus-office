<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5f1e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Nexus Office</title>
  <link rel="apple-touch-icon" href="/office-icon-192.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/office.css">
  <link rel="stylesheet" href="/office-v2.css">
  <script src="/office-register-sw.js"></script>
</head>
<body>
<noscript><p>Enable JavaScript for the interactive office. <a href="/lessons">Lesson previews</a></p></noscript>
<div class="shell">
  <header class="topbar">
    <a class="wordmark" href="#watch">nexus <i>office</i><span class="connection" id="connection">Connecting</span></a>
    <button id="settings" disabled aria-label="Open settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="15" cy="17" r="2"/></svg></button>
    <button class="primary" id="new-task" disabled>+ New task</button>
  </header>
  <div class="searchbar">
    <label for="global-search">⌕</label>
    <input id="global-search" aria-label="Search everything in Office" type="search" placeholder="Search Office" autocomplete="off">
    <button id="search-go" aria-label="Search everything">Search</button>
  </div>
  <main id="content" tabindex="-1"></main>
  <aside id="player" hidden aria-label="Podcast player"></aside>
  <nav class="tabs" aria-label="Office">
    <a href="#watch" aria-label="Watch"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2.75 12s3.25-6 9.25-6 9.25 6 9.25 6-3.25 6-9.25 6-9.25-6-9.25-6Z"/><circle cx="12" cy="12" r="2.5"/></svg></span><span>Watch</span></a>
    <a href="#feed" aria-label="Feed"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4.5" width="16" height="15" rx="1.8"/><path d="M8 9h8M8 12.5h8M8 16h5"/></svg></span><span>Feed</span></a>
    <a href="#ask" aria-label="Ask"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 5.5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-5 3v-3H5a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2Z"/><path d="M8 10h8M8 13.5h5"/></svg></span><span>Ask</span></a>
    <a href="#find" aria-label="Find"><span class="tab-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg></span><span>Find</span></a>
  </nav>
</div>
<dialog id="detail">
  <header>
    <button id="close-detail" aria-label="Close detail"><span>←</span> Back</button>
    <span id="detail-title"></span>
    <button id="detail-search" aria-label="Search everything">⌕</button>
    <button id="detail-attention" aria-label="Items needing you">!</button>
  </header>
  <div id="detail-body"></div>
</dialog>
<div id="notice" role="status" hidden></div>
<audio id="audio" preload="metadata"></audio>
</body>
</html>
