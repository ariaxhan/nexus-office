<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Lesson previews</title>
<link rel="stylesheet" href="/lessons.css">
</head>
<body>
<header><a href="/">Office</a><div><h1>Lesson previews</h1><p id="summary" aria-live="polite">opening</p></div></header>
<main>
  <section class="preview-section" aria-labelledby="preview-heading">
    <div class="section-heading"><div><p class="eyebrow">Ready to review</p><h2 id="preview-heading">Verified previews</h2></div><p id="preview-count" class="count"></p></div>
    <div id="previews"></div>
  </section>
  <section class="coverage-section" aria-labelledby="coverage-heading">
    <div class="section-heading"><div><p class="eyebrow">Inventory</p><h2 id="coverage-heading">Preview coverage</h2></div><button id="toggle-all" type="button" aria-expanded="false" hidden>Show all lessons</button></div>
    <div id="coverage"></div>
    <div id="all-lessons" hidden></div>
  </section>
</main>
<script src="/lessons.js"></script>
</body>
</html>
