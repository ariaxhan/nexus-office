<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Outlines · Office</title>
<link rel="stylesheet" href="/lessons.css">
<style>
.outline-card { grid-template-columns:1fr auto; }
.outline-card .open { display:grid; gap:4px; text-align:left; width:100%; margin:0; padding:0; background:none; border:0; color:inherit; font:inherit; grid-column:1; }
.outline-card .decision { overflow-wrap:anywhere; } .outline-card .value, .value { font-size:13px; opacity:.85; overflow-wrap:anywhere; }
.proposed { font-style:normal; font-size:12px; color:var(--amber); border:1px solid currentColor; border-radius:4px; padding:0 4px; margin-right:6px; }
.queued { font-size:12px; color:var(--green); white-space:nowrap; }
.outline-card .feedback { grid-column:1/-1; font-size:12px; }
</style>
</head>
<body>
<header><a href="/">Office</a><h1>Outlines</h1><p id="summary" role="status">Opening outlines…</p></header>
<main><p class="intro">Plain-text lesson outlines. Read one, then approve it so the page can be built. <a href="/lessons">Lesson status</a></p>
<div id="list"></div><div id="reader" hidden></div></main>
<script src="/outlines.js"></script>
</body>
</html>
