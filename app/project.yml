name: Office
options:
  bundleIdPrefix: app.nexusoffice
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    PRODUCT_NAME: Office
    PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Office
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: Office/Resources/Info.plist
    # Personal tool on your own machine: ad-hoc signed, non-sandboxed, no
    # hardened runtime. It talks to 127.0.0.1 and nothing else.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_APP_SANDBOX: NO
    # The icon, from Office/Resources/Assets.xcassets. Every pixel of it is
    # drawn by `scripts/icon.swift` and none of it is a file somebody exported,
    # so the mark is a diff like everything else here.
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  Office:
    type: application
    platform: macOS
    settings:
      base:
        INFOPLIST_PREPROCESS: YES
        INFOPLIST_PREFIX_HEADER: "$(DERIVED_FILE_DIR)/NexusBuildIdentity.h"
    sources:
      - path: Office
      # The demo fixture ships inside the bundle too, so the app has a floor to
      # draw even when `--demo` points at a path that has moved.
      - path: Demo
        buildPhase: resources
    preBuildScripts:
      - name: Embed immutable source revision
        script: |
          "$SRCROOT/../scripts/write-build-identity.sh" "$DERIVED_FILE_DIR/NexusBuildIdentity.h"
        outputFiles:
          - "$(DERIVED_FILE_DIR)/NexusBuildIdentity.h"
        basedOnDependencyAnalysis: false
  # Standalone unit-test bundle: no app host, no signing, no AppKit. It compiles
  # only the Foundation-only files, so the rules that decide what a desk is,
  # which question an answer belongs to, and what survives switching threads are
  # provable headlessly and cannot quietly start depending on a view.
  #
  # `Store` and `Api` are in here because a draft that outlives the view showing
  # it is a claim about the store and nothing else, and because the demo floor is
  # the only fake `Api` worth having. Neither imports AppKit or SwiftUI, and the
  # day one of them does, this target stops building, which is the point.
  OfficeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: OfficeTests
      - path: Office/Model/StateRules.swift
      - path: Office/Model/Models.swift
      # The palette, as numbers. Whether a person can read a grey on a paper
      # background is arithmetic on three channels, and arithmetic is the one
      # thing about a colour that must not be settled by looking at it: two
      # greys that are obviously different on the machine that picked them are
      # one grey on a laptop at an angle in a bright room.
      - path: Office/Model/Palette.swift
      # Shrinking a picture to fit the door is arithmetic on bytes, and the
      # failure is a payload a hundred kilobytes too big that only says so on a
      # real send. ImageIO and CoreGraphics, no AppKit, so it stays provable here.
      - path: Office/Model/Attachment.swift
      - path: Office/Model/GateAnswer.swift
      - path: Office/Model/Store.swift
      - path: Office/Model/Api.swift
      # The automation page and the session roster: both are pure decoding of
      # what the server measured, and both have states that must never render as
      # each other. Foundation only, so they prove out with no app host.
      - path: Office/Model/Automation.swift
      - path: Office/Model/Sessions.swift
      # A mark on a turn. In here because the only interesting thing about a
      # reaction is which turn it lands on, and that is arithmetic on a string:
      # keyed by position it slides onto somebody else's sentence when the
      # transcript grows, and keyed by a process-seeded hash it disappears every
      # relaunch. Neither failure is visible in a screenshot, so neither can be
      # left to one.
      - path: Office/Model/Reactions.swift
      # A desk's face. The colour is a pure function of the repo path, ported
      # from the villagers' own `src/names.js`, and the whole claim is that the
      # same desk gets the same coat on every machine and after every relaunch.
      # That is arithmetic on a string and invisible in a screenshot: a picture
      # shows a floor of colours whether or not they are the same colours as
      # yesterday.
      - path: Office/Model/Faces.swift
      # The preferences that outlive a launch. In here because the only
      # interesting thing about them is what a bad stored value does: an order
      # written by a newer version has to fall back rather than reorder the
      # floor into something nobody chose, and neither that nor "it came back
      # after a relaunch" is a thing a screenshot can show.
      - path: Office/Model/Preferences.swift
    settings:
      base:
        PRODUCT_NAME: OfficeTests
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.OfficeTests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
schemes:
  Office:
    build:
      targets:
        Office: [run, build, archive]
    run:
      config: Debug
  OfficeTests:
    build:
      targets:
        OfficeTests: [test]
    test:
      targets:
        - OfficeTests
