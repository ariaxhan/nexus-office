name: OfficeMobile
options:
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '2'
    OFFICE_URL: https://arias-macbook-pro-2.tail4f309a.ts.net
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8TBWTVY269
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  OfficeMobile:
    type: application
    platform: iOS
    sources: [OfficeMobile]
    info:
      path: OfficeMobile/Info.plist
      properties:
        CFBundleDisplayName: Office
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        OfficeURL: $(OFFICE_URL)
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Attach a photo to a task running on your Mac.
        NSPhotoLibraryUsageDescription: Choose photos to attach to your Office tasks.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Mobile
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets: [OfficeMobileUITests]
  OfficeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OfficeMobileUITests]
    dependencies:
      - target: OfficeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Mobile.UITests
        GENERATE_INFOPLIST_FILE: YES
