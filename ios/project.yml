name: OfficeMobile
options:
  # XcodeGen 2.46 embeds single-target watchOS apps in Watch/; Xcode 26 expects PlugIns/.
  postGenCommand: sed -i '' -e 's|dstPath = "$(CONTENTS_FOLDER_PATH)/Watch";|dstPath = "";|' -e 's|dstSubfolderSpec = 16;|dstSubfolderSpec = 13;|' OfficeMobile.xcodeproj/project.pbxproj
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '2'
    OFFICE_URL: https://office.tail4f309a.ts.net
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 8TBWTVY269
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  OfficeMobile:
    type: application
    platform: iOS
    sources: [OfficeMobile]
    info:
      path: OfficeMobile/Info.plist
      properties:
        CFBundleDisplayName: Office
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        OfficeURL: $(OFFICE_URL)
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        CFBundleURLTypes:
          - CFBundleURLSchemes: [nexusoffice]
        NSCameraUsageDescription: Attach a photo to a task running on your Mac.
        NSPhotoLibraryUsageDescription: Choose photos to attach to your Office tasks.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Mobile
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: OfficeMobile/OfficeMobile.entitlements
    scheme:
      testTargets: [OfficeMobileUITests]
    dependencies:
      - target: OfficeWidgets
      - target: OfficeWatch
  OfficeWidgets:
    type: app-extension
    platform: iOS
    sources: [OfficeWidgets]
    info:
      path: OfficeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Office Widgets
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Mobile.Widgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: OfficeWidgets/OfficeWidgets.entitlements
  OfficeWatch:
    type: application
    platform: watchOS
    deploymentTarget: '10.0'
    sources: [OfficeWatch]
    info:
      path: OfficeWatch/Info.plist
      properties:
        CFBundleDisplayName: Office
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        WKCompanionAppBundleIdentifier: app.nexusoffice.Mobile
        WKApplication: true
        WKWatchOnly: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Mobile.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
  OfficeMobileUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [OfficeMobileUITests]
    dependencies:
      - target: OfficeMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nexusoffice.Mobile.UITests
        GENERATE_INFOPLIST_FILE: YES
